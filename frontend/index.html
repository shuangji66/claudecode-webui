<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Claude Code</title>
    <script>
      // 样式加载前先定主题/字号，避免深色模式闪白。设置页同步后会再次覆盖。
      (function () {
        try {
          var pref = localStorage.getItem("ccweb-theme-pref") || "system";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? "dark" : "light";
          root.dataset.themePreference = pref;
          var font = parseInt(localStorage.getItem("ccweb-font-size") || "15", 10);
          if (!(font >= 12 && font <= 20)) font = 15;
          root.style.setProperty("--chat-font-size", font + "px");
          root.style.setProperty("--code-font-size", Math.max(10, font - 2.5) + "px");
          root.lang = localStorage.getItem("ccweb-locale") || "zh";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      启动兜底：任何"白屏"都要能自我解释。
      最常见的原因是浏览器或网关缓存了旧的 index.html，它引用的哈希资源
      在新构建里已经不存在（404）——此时模块脚本根本没执行，页面就是空白。
      这里把资源加载失败/未挂载显式画出来，避免用户只看到一片白。
    -->
    <script>
      (function () {
        var shown = false;
        function fail(title, detail, hint) {
          if (shown) return;
          shown = true;
          var el = document.getElementById("root");
          if (!el) return;
          el.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a">' +
            '<div style="max-width:520px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;padding:20px">' +
            '<div style="font-size:15px;font-weight:600;color:#b91c1c">' + title + "</div>" +
            '<div style="margin-top:8px;font-size:12px;line-height:1.6;color:#475569;word-break:break-all">' + detail + "</div>" +
            '<div style="margin-top:12px;font-size:12px;line-height:1.6;color:#475569">' +
            hint +
            "</div></div></div>";
        }
        var HINT_RESOURCE =
          "常见原因：静态资源 404（浏览器或网关缓存了旧的 index.html）。<br/>" +
          "处理：强制刷新（Ctrl/Cmd+Shift+R），或在网关侧清除该路径的缓存；" +
          "仍不行请确认当前运行的二进制与前端产物是同一次构建。";
        var HINT_SCRIPT =
          "这是前端脚本运行时错误，与浏览器缓存无关——把这条信息反馈即可定位。<br/>" +
          "临时处理：可在设置页清空有问题的配置，或删掉数据目录下的 settings.json 后重启。";
        window.addEventListener(
          "error",
          function (e) {
            var t = e && e.target;
            if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
              fail("静态资源加载失败", (t.src || t.href) + " 无法加载（多为 404）", HINT_RESOURCE);
            } else if (e && e.message) {
              fail("前端脚本出错", String(e.message), HINT_SCRIPT);
            }
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          fail("前端脚本出错", "未捕获的 Promise 错误：" + String(e && e.reason), HINT_SCRIPT);
        });
        setTimeout(function () {
          var r = document.getElementById("root");
          if (r && r.childElementCount === 0 && !shown) {
            fail("页面未能挂载", "根节点仍为空：脚本可能 404，或执行到一半失败。", HINT_RESOURCE);
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
